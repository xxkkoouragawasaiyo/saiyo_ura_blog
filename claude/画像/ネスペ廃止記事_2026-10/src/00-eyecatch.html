<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.canvas.ey{height:630px;padding:0;background:var(--navy);color:#fff}
.canvas.ey::before{display:none}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:center}
.lbl{font-size:34px;font-weight:700;color:#c9d6e8}
.big{margin-top:10px;font-size:124px;font-weight:900;line-height:1.15}
.big em{font-style:normal;color:#ffb36b}
.mid{margin-top:22px;display:flex;align-items:center;gap:22px}
.mid .y{padding:8px 26px;border-radius:12px;background:var(--orange);font-size:60px;font-weight:900}
.mid .q{font-size:54px;font-weight:900}
.by{margin-top:40px;font-size:32px;font-weight:700;color:#c9d6e8}
.bar{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(90deg,var(--orange) 0 22%,#fff 22% 100%);opacity:.9}
.mark{position:absolute;right:72px;bottom:44px;font-size:28px;font-weight:700;color:#fff;opacity:.85}
</style></head><body><div class="canvas ey"><div class="in">
<div class="lbl">ネットワークスペシャリスト試験</div>
<div class="big">ネスペは<em>廃止？</em></div>
<div class="mid"><span class="y">2026年度が最後</span><span class="q">合格者はどうなる？</span></div>
<div class="by">現役IT人事が解説｜IPA公式情報をもとに整理</div>
</div><div class="mark">採用のウラ側</div><div class="bar"></div></div></body></html>
