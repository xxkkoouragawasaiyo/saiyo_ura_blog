<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.steps{margin-top:40px}
.step{display:flex;gap:28px;padding:26px 30px;border-radius:18px;background:var(--bg)}
.down{height:44px;padding-left:62px}
.num{flex:none;width:76px;height:76px;border-radius:50%;background:var(--navy);color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center}
.m{font-size:42px;font-weight:900;line-height:1.3}
.s{margin-top:8px;font-size:34px;line-height:1.45;color:var(--ink)}
.ex{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:10px;background:#fff;border:2px solid var(--line);font-size:30px;font-weight:700;color:var(--navy)}
.pend{margin-top:32px;display:flex;align-items:center;gap:20px;padding:22px 28px;border-radius:16px;border:3px dashed var(--orange)}
.pend .t{font-size:34px;font-weight:700}
</style></head><body><div class="canvas">
<div class="title">今回受けた人の<em>これから</em></div>
<div class="sub">2026年度前期にネスペを受けた人向け</div>
<div class="steps">
  <div class="step"><div class="num">1</div><div><div class="m">合格発表を待つ</div><div class="s">最後の合格発表は2027年2月頃（予定）</div></div></div>
  <div class="down"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v30M8 24l12 14 12-14" fill="none" stroke="#5f6773" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="step"><div class="num">2</div><div><div class="m">発表前に応募するなら</div><div class="s">資格欄の補足に、受験済みと発表の予定を書く</div><div class="ex">受験済み（2027年2月頃 合格発表予定）</div></div></div>
  <div class="down"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v30M8 24l12 14 12-14" fill="none" stroke="#5f6773" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="step"><div class="num">3</div><div><div class="m">合格したら正式な名前で</div><div class="s">新試験の名前には書き換えない</div><div class="ex">ネットワークスペシャリスト試験 合格</div></div></div>
</div>
<div class="pend"><span class="chip orange">未定</span><span class="t">新試験での科目免除は、IPAが検討中</span></div>
<div class="footer"><span>日程：IPA（2026年10月25日時点）｜書き方：筆者（現役IT人事）の考え方</span><span class="brand">採用のウラ側</span></div>
</div></body></html>
