<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.steps{margin-top:40px}
.step{display:flex;align-items:center;gap:28px;padding:22px 28px;border-radius:18px;background:var(--bg)}
.step+.down{height:44px;display:flex;justify-content:flex-start;padding-left:58px}
.num{flex:none;width:76px;height:76px;border-radius:50%;background:var(--navy);color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .m{font-size:42px;font-weight:900}
.step .s{margin-top:2px;font-size:32px;color:var(--gray)}
.step.hl{background:var(--orange-soft);outline:4px solid var(--orange)}
.step.hl .num{background:var(--orange)}
.step.iv .num{background:#fff;color:var(--navy);border:4px solid var(--navy);font-size:30px}
.disc{margin-top:28px;font-size:30px;color:var(--gray)}
</style></head><body><div class="canvas">
<div class="title">人事が応募書類を読む<em>順番</em></div>
<div class="sub">筆者（現役IT人事）の場合</div>
<div class="steps">
  <div class="step"><div class="num">1</div><div><div class="m">推薦文</div><div class="s">転職エージェント経由の応募のとき、最初に読む</div></div></div>
  <div class="down"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v30M8 24l12 14 12-14" fill="none" stroke="#5f6773" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="step"><div class="num">2</div><div><div class="m">経歴の流れ</div><div class="s">転職回数など。どんな仕事をしてきたか</div></div></div>
  <div class="down"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v30M8 24l12 14 12-14" fill="none" stroke="#5f6773" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="step hl"><div class="num">3</div><div><div class="m">資格欄（ここでネスペ）</div><div class="s">経歴のネットワークの仕事を、資格が裏づける</div></div></div>
  <div class="down"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v30M8 24l12 14 12-14" fill="none" stroke="#5f6773" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="step iv"><div class="num">面接</div><div><div class="m">なぜ取ったのかを聞く</div><div class="s">考えていない答えだと、少しマイナス</div></div></div>
</div>
<div class="disc">※1人の人事の見方です。統計や公式の数字ではありません。</div>
<div class="footer"><span>筆者の書類選考・面接の経験から｜2026年10月時点</span><span class="brand">採用のウラ側</span></div>
</div></body></html>
