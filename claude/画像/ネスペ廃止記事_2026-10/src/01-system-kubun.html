<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.flow{margin-top:44px;display:flex;align-items:center;gap:28px}

.old .when{font-size:30px;font-weight:700;color:var(--gray)}

.kubun.on .chip{background:var(--orange);color:#fff}
</style></head><body><div class="canvas">

<div class="flow">
