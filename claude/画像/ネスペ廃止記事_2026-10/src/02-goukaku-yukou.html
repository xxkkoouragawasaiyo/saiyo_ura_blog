<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.tiles{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tile{background:var(--green-soft);border-radius:20px;padding:34px 20px 30px;text-align:center}
.tile svg{display:block;margin:0 auto 18px}
.tile .t{font-size:38px;word-break:keep-all;font-weight:900;line-height:1.35;color:var(--ink)}
.cmp{margin-top:36px;display:flex;align-items:center;gap:24px;padding:26px 30px;border:3px dashed var(--line);border-radius:18px}
.cmp .t{font-size:34px;line-height:1.5}
.cmp b{color:var(--navy)}
</style></head><body><div class="canvas">
<div class="title">合格済みのネスペは<em>そのまま有効</em></div>
<div class="sub">試験の名前がなくなっても、合格した事実は消えません</div>
<div class="tiles">
  <div class="tile"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#23855b"/><path d="M28 50l14 14 26-30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="t">合格は<br>取り消されない</div></div>
  <div class="tile"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#23855b"/><path d="M28 50l14 14 26-30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="t">有効期限は<br>ない</div></div>
  <div class="tile"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#23855b"/><path d="M28 50l14 14 26-30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="t">更新の手続きは<br>いらない</div></div>
</div>
<div class="cmp"><span class="chip gray">比較</span><div class="t">更新の手続きがあるのは<b>情報処理安全確保支援士</b><br>（合格後に登録して名乗る資格）</div></div>
<div class="footer"><span>情報処理技術者試験の合格の扱い｜2026年10月25日時点</span><span class="brand">採用のウラ側</span></div>
</div></body></html>
